<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Изучение языков</title>
    <!-- Подключаем стили, если они будут в frontend/static/css/style.css -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        #message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Registration</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="login">Login</label>
                <input type="text" id="login" required placeholder="Придумайте логин">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Не менее 4 символов">
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginInput = document.getElementById('login').value;
            const passwordInput = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.textContent = 'Отправка данных...';
            messageDiv.className = '';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login: loginInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'Успешно! Перенаправление...';
                    messageDiv.className = 'success';
                    // Через 1 секунду перенаправляем на страницу тренировки карточек
                    setTimeout(() => {
                        window.location.href = '/study';
                    }, 1000);
                } else {
                    // Если бэкенд вернул ошибку (например, 409 или 400)
                    messageDiv.textContent = data.message || 'Ошибка регистрации';
                    messageDiv.className = 'error';
                }
            } catch (err) {
                console.error(err);
                messageDiv.textContent = 'Не удалось подключиться к серверу';
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
